<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | default: 'Sophia Yoo — Assistant Professor in Computer Science at Amherst College, working on network security and privacy.' }}">

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="/assets/img/favicons/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/img/favicons/apple-touch-icon.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="site-nav" aria-label="Site navigation">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/assets/img/Yoo_Headshot.jpg" class="nav-avatar" alt="">
        Sophia Yoo
      </a>
      <div class="nav-links">
        <a href="/research/"      {% if page.url contains '/research'      %}class="active"{% endif %}>Research</a>
        <a href="/publications/"  {% if page.url contains '/publications'  %}class="active"{% endif %}>Publications</a>
        <a href="/teaching/"      {% if page.url contains '/teaching'      %}class="active"{% endif %}>Teaching</a>
        <a href="/cv/"            {% if page.url contains '/cv'            %}class="active"{% endif %}>CV</a>
        <a href="/interests/"     {% if page.url contains '/interests'     %}class="active"{% endif %}>Interests</a>
      </div>
    </div>
  </nav>

  {{ content }}

  <!-- Footer -->
  <footer class="site-footer">
    <p>
      Sophia Yoo &middot;
      Assistant Professor,
      <a href="https://www.amherst.edu/academiclife/departments/computer_science" target="_blank" rel="noopener">Computer Science at Amherst College</a>
      &middot; syoo[at]amherst.edu
    </p>
  </footer>

</body>
</html>
