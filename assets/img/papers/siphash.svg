<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <marker id="ha" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#4da6ff"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="20" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#536070" letter-spacing="0.06em">SIPHASH ON PROGRAMMABLE SWITCH PIPELINE</text>

  <!-- Input: Key + Message -->
  <rect x="16" y="55" width="88" height="34" rx="6" fill="#0d1a28" stroke="#2a3a50" stroke-width="1.2"/>
  <text x="60" y="69" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#8fa3b8">Secret Key k</text>
  <text x="60" y="82" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#536070">128-bit</text>

  <rect x="16" y="100" width="88" height="34" rx="6" fill="#0d1a28" stroke="#2a3a50" stroke-width="1.2"/>
  <text x="60" y="114" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#8fa3b8">Message m</text>
  <text x="60" y="127" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#536070">packet field</text>

  <!-- Arrows in -->
  <line x1="105" y1="72" x2="128" y2="90" stroke="#4da6ff" stroke-width="1.2" marker-end="url(#ha)"/>
  <line x1="105" y1="117" x2="128" y2="100" stroke="#4da6ff" stroke-width="1.2" marker-end="url(#ha)"/>

  <!-- Pipeline stages (P4 match-action) -->
  <!-- Stage 1: Init -->
  <rect x="130" y="62" width="88" height="56" rx="7" fill="#0d1820" stroke="#4da6ff" stroke-width="1.4"/>
  <text x="174" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4da6ff" font-weight="700">Stage 1</text>
  <text x="174" y="94" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#eaf0f8">Initialise</text>
  <text x="174" y="107" text-anchor="middle" font-family="Inter,sans-serif" font-size="8.5" fill="#8fa3b8">v0 v1 v2 v3</text>

  <line x1="219" y1="90" x2="236" y2="90" stroke="#4da6ff" stroke-width="1.4" marker-end="url(#ha)"/>

  <!-- Stage 2: SipRound ×2 -->
  <rect x="238" y="62" width="100" height="56" rx="7" fill="#0d1820" stroke="#4da6ff" stroke-width="1.4"/>
  <text x="288" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4da6ff" font-weight="700">Stage 2</text>
  <text x="288" y="94" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#eaf0f8">SipRound ×c</text>
  <text x="288" y="107" text-anchor="middle" font-family="Inter,sans-serif" font-size="8.5" fill="#8fa3b8">ADD, XOR, ROT</text>

  <line x1="339" y1="90" x2="356" y2="90" stroke="#4da6ff" stroke-width="1.4" marker-end="url(#ha)"/>

  <!-- Stage 3: Compress -->
  <rect x="358" y="62" width="100" height="56" rx="7" fill="#0d1820" stroke="#4da6ff" stroke-width="1.4"/>
  <text x="408" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4da6ff" font-weight="700">Stage 3</text>
  <text x="408" y="94" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#eaf0f8">Compress</text>
  <text x="408" y="107" text-anchor="middle" font-family="Inter,sans-serif" font-size="8.5" fill="#8fa3b8">XOR message</text>

  <line x1="459" y1="90" x2="476" y2="90" stroke="#4da6ff" stroke-width="1.4" marker-end="url(#ha)"/>

  <!-- Stage 4: Finalize -->
  <rect x="478" y="62" width="100" height="56" rx="7" fill="#0d1820" stroke="#4da6ff" stroke-width="1.4"/>
  <text x="528" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4da6ff" font-weight="700">Stage 4</text>
  <text x="528" y="94" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#eaf0f8">Finalize</text>
  <text x="528" y="107" text-anchor="middle" font-family="Inter,sans-serif" font-size="8.5" fill="#8fa3b8">SipRound ×d</text>

  <line x1="579" y1="90" x2="596" y2="90" stroke="#4da6ff" stroke-width="1.4" marker-end="url(#ha)"/>

  <!-- Output -->
  <rect x="598" y="68" width="90" height="44" rx="7" fill="#0d1a28" stroke="#3fb950" stroke-width="1.4"/>
  <text x="643" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#3fb950" font-weight="700">Hash</text>
  <text x="643" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#8fa3b8">64-bit MAC</text>

  <!-- Hardware constraint callout -->
  <rect x="100" y="140" width="500" height="30" rx="7" fill="#0a1520" stroke="#1e2a38"/>
  <text x="350" y="153" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#eaf0f8" font-weight="600">P4 constraint: no loops → SipHash rounds unrolled across match-action stages</text>
  <text x="350" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#8fa3b8">enables cryptographic-strength keyed hashing at programmable switch line rate</text>
</svg>
