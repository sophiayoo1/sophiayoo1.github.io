<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <marker id="ta" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#4da6ff"/>
    </marker>
    <marker id="ta-g" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#3fb950"/>
    </marker>
    <marker id="ta-r" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="20" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#536070" letter-spacing="0.06em">COLLABORATIVE ROUTE CONTROL</text>

  <!-- AS A -->
  <rect x="30" y="48" width="110" height="56" rx="8" fill="#0d1a28" stroke="#4da6ff" stroke-width="1.5"/>
  <text x="85" y="70" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#4da6ff" font-weight="700">AS A</text>
  <text x="85" y="85" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#8fa3b8">edge network</text>
  <text x="85" y="98" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#3fb950">TANGO node</text>

  <!-- AS B (partner) -->
  <rect x="30" y="120" width="110" height="48" rx="8" fill="#0d1a28" stroke="#4da6ff" stroke-width="1.5"/>
  <text x="85" y="140" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#4da6ff" font-weight="700">AS B</text>
  <text x="85" y="155" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#8fa3b8">partner network</text>

  <!-- BGP cooperation arrow A↔B -->
  <line x1="85" y1="104" x2="85" y2="119" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="91" y="113" font-family="Inter,sans-serif" font-size="8.5" fill="#3fb950">BGP</text>

  <!-- Internet cloud (middle) -->
  <ellipse cx="320" cy="95" rx="68" ry="40" fill="none" stroke="#1e2a38" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="320" y="90" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#536070">Internet</text>
  <text x="320" y="106" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#536070">(public core)</text>

  <!-- Good path A → Internet → Destination -->
  <path d="M 141 70 Q 230 48 388 70" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#ta-g)"/>
  <text x="264" y="44" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#3fb950" font-weight="600">safe path (BGP-selected)</text>

  <!-- Bad path (default, hijack risk) -->
  <path d="M 141 100 Q 230 118 388 110" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ta-r)"/>
  <text x="264" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#f85149">risky default path</text>

  <!-- Relay path through AS B -->
  <path d="M 141 140 Q 240 155 388 130" fill="none" stroke="#4da6ff" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ta)"/>
  <text x="270" y="152" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#4da6ff">relay via partner</text>

  <!-- Destination AS -->
  <rect x="600" y="60" width="120" height="56" rx="8" fill="#0d1a28" stroke="#2a3a50" stroke-width="1.2"/>
  <text x="660" y="82" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#eaf0f8" font-weight="600">Destination AS</text>
  <text x="660" y="98" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#8fa3b8">target network</text>
  <text x="660" y="111" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#3fb950">reached safely</text>

  <!-- Callout -->
  <rect x="456" y="128" width="280" height="38" rx="7" fill="#0a1520" stroke="#1e2a38"/>
  <text x="596" y="143" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#eaf0f8" font-weight="600">No core changes · uses existing BGP</text>
  <text x="596" y="158" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#8fa3b8">cooperating ASes probe &amp; vote on path safety</text>
</svg>
